server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 location /api/auth/ { proxy_pass http://auth:8080/; }
 location /api/inventory/ { proxy_pass http://inventory:8080/; }
 location /api/orders/ { proxy_pass http://orders:8080/; }
 location /api/payments/ { proxy_pass http://payments:8080/; }
 location / {
  add_header Cache-Control "no-cache";
  try_files $uri $uri/ /index.html;
 }
}
