services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  auth:
    build: {context: ., dockerfile: AuthApi/Dockerfile}
    environment:
      ConnectionStrings__Db: ${SUPABASE_DB:?Falta SUPABASE_DB en TiendaRelojes/.env}
      JWT_KEY: ${JWT_KEY:-clave-local-de-demostracion-cambiar-en-produccion-2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tiempoyestilo.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
  inventory:
    build: {context: ., dockerfile: InventoryApi/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ConnectionStrings__Db: ${SUPABASE_DB:?Falta SUPABASE_DB en TiendaRelojes/.env}
      JWT_KEY: ${JWT_KEY:-clave-local-de-demostracion-cambiar-en-produccion-2026}
    depends_on: {kafka: {condition: service_healthy}}
  orders:
    build: {context: ., dockerfile: OrdersApi/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      INVENTORY_URL: http://inventory:8080
      ConnectionStrings__Db: ${SUPABASE_DB:?Falta SUPABASE_DB en TiendaRelojes/.env}
      JWT_KEY: ${JWT_KEY:-clave-local-de-demostracion-cambiar-en-produccion-2026}
    depends_on: {kafka: {condition: service_healthy}, inventory: {condition: service_started}}
  payments:
    build: {context: ., dockerfile: PaymentsApi/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ORDERS_URL: http://orders:8080
      ConnectionStrings__Db: ${SUPABASE_DB:?Falta SUPABASE_DB en TiendaRelojes/.env}
      JWT_KEY: ${JWT_KEY:-clave-local-de-demostracion-cambiar-en-produccion-2026}
    depends_on: {kafka: {condition: service_healthy}, orders: {condition: service_started}}
  web:
    image: nginx:1.27-alpine
    ports: ['8088:80']
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [auth, inventory, orders, payments]
